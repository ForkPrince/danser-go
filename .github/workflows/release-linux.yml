name: Build & Release Linux

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build and release Linux version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install needed packages
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libgl1-mesa-dev libgtk-3-dev

      - name: Install golang
        uses: actions/setup-go@v3
        with:
          go-version: '1.24.1'
          cache: true

      - name: Build danser
        run: |
          version="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          chmod +x dist-linux.sh
          ./dist-linux.sh $version
          if [ ! -f "dist/artifacts/danser-${version// /-s}-linux.zip" ]; then
            echo "Danser failed to build"
            exit 1
          fi
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Extract repository name
        run: echo "NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Upload Build
        uses: marvinpinto/action-automatic-releases@master
        with:
          title: "${{ env.NAME }}"
          automatic_release_tag: "latest"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          files: "dist/artifacts/*"
          prerelease: false
